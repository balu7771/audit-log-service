services:
  postgres:
    image: postgres:16-alpine
    container_name: audit-log-postgres
    environment:
      POSTGRES_DB: auditlog
      POSTGRES_USER: auditlog
      POSTGRES_PASSWORD: auditlog
    ports:
      - "5432:5432"
    volumes:
      - audit-log-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditlog -d auditlog"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audit-log-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auditlog
      SPRING_DATASOURCE_USERNAME: auditlog
      SPRING_DATASOURCE_PASSWORD: auditlog
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      # Example only — replace with real secrets for anything beyond local dev.
      AUDIT_API_KEY: local-compose-key-change-me
      AUDIT_EXPORT_SIGNING_KEY: local-compose-export-key-change-me
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  audit-log-postgres-data:
