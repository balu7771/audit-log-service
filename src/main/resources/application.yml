spring:
  application:
    name: audit-log-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auditlog
    username: auditlog
    password: auditlog
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

audit:
  security:
    # Shared-secret required on every /audit/** request via the X-API-Key header.
    # Override via AUDIT_API_KEY in any real deployment; the fallback below is
    # for local docker-compose/dev use only.
    api-key: ${AUDIT_API_KEY:local-dev-only-key-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    use-root-path: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false
