spring:
  application:
    name: audit-log-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auditlog
    username: auditlog
    password: auditlog
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

audit:
  security:
    # Per-caller API keys, each scoped to the roles it is trusted for (RBAC):
    #   WRITER  - create audit events only (event-producing services)
    #   AUDITOR - read-only: query, chain verification, export, export verification
    #   ADMIN   - retention archival + field redaction (implies AUDITOR and WRITER too;
    #             see SecurityConfig's role hierarchy)
    # Override every key via its AUDIT_API_KEY_* env var in any real deployment; the
    # fallbacks below are for local dev only and must never be reused elsewhere.
    api-keys:
      - key: ${AUDIT_API_KEY_WRITER:local-dev-writer-key-change-me}
        name: default-writer
        roles: [WRITER]
      - key: ${AUDIT_API_KEY_AUDITOR:local-dev-auditor-key-change-me}
        name: default-auditor
        roles: [AUDITOR]
      - key: ${AUDIT_API_KEY_ADMIN:local-dev-admin-key-change-me}
        name: default-admin
        roles: [ADMIN]
    # HMAC-SHA256 key used to sign/verify export bundle manifests. Override via
    # AUDIT_EXPORT_SIGNING_KEY in any real deployment.
    export-signing-key: ${AUDIT_EXPORT_SIGNING_KEY:local-dev-only-export-key-change-me}
  retention:
    # Default retention window (days) used by POST /audit/retention/archive
    # when no windowDays override is supplied.
    window-days: ${AUDIT_RETENTION_WINDOW_DAYS:365}
  export:
    # Hard cap on records per bulk export bundle; exceeding it returns 400
    # rather than attempting an unbounded in-memory export.
    max-records: ${AUDIT_EXPORT_MAX_RECORDS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    use-root-path: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false
