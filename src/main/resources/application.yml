spring:
  application:
    name: audit-log-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auditlog
    username: auditlog
    password: auditlog
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

audit:
  security:
    # Shared-secret required on every /audit/** request via the X-API-Key header.
    # Override via AUDIT_API_KEY in any real deployment; the fallback below is
    # for local docker-compose/dev use only.
    api-key: ${AUDIT_API_KEY:local-dev-only-key-change-me}
    # HMAC-SHA256 key used to sign/verify export bundle manifests. Override via
    # AUDIT_EXPORT_SIGNING_KEY in any real deployment.
    export-signing-key: ${AUDIT_EXPORT_SIGNING_KEY:local-dev-only-export-key-change-me}
  retention:
    # Default retention window (days) used by POST /audit/retention/archive
    # when no windowDays override is supplied.
    window-days: ${AUDIT_RETENTION_WINDOW_DAYS:365}
  export:
    # Hard cap on records per bulk export bundle; exceeding it returns 400
    # rather than attempting an unbounded in-memory export.
    max-records: ${AUDIT_EXPORT_MAX_RECORDS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    use-root-path: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false
