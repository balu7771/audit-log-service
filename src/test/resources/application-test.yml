spring:
  jpa:
    show-sql: false

audit:
  security:
    api-keys:
      - key: test-writer-key
        name: test-writer
        roles: [WRITER]
      - key: test-auditor-key
        name: test-auditor
        roles: [AUDITOR]
      - key: test-admin-key
        name: test-admin
        roles: [ADMIN]
    export-signing-key: test-export-signing-key
  retention:
    window-days: 365
  export:
    max-records: 10000

logging:
  level:
    org.testcontainers: INFO
    com.persistent.auditlog: DEBUG
