info:
  name: Scenario B - Retention and Redaction
  type: folder

request:
  auth: inherit

docs:
  content: |-
    Extends Scenario A with retention/archival, redaction, and bulk export.

    RBAC note: this folder spans all three roles - create (WRITER), archive
    and redact (ADMIN), export/verify/query (AUDITOR) - each request sets its
    own X-API-Key header ({{writerApiKey}}, {{adminApiKey}}, or
    {{auditorApiKey}}) rather than inheriting one folder-wide key.
  type: text/markdown
