info:
  name: 03. Create Third Event for Export
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/audit/events"
  body:
    type: json
    data: |-
      {
        "eventType": "DATA_DOWNLOAD",
        "actorId": "compliance@example.com",
        "resourceType": "CUSTOMER_RECORD",
        "resourceId": "cust-1001",
        "payload": "{\"downloadFormat\": \"CSV\", \"recordCount\": 1, \"downloadedAt\": \"2026-08-29T14:30:00Z\", \"exportReason\": \"audit-request\"}",
        "sensitiveFields": []
      }
  headers:
    - name: X-API-Key
      value: "{{writerApiKey}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Test Case 3: Third event on cust-1001. There are now 3 linked events for this
  resource, ready for archive/redact/export testing.
