name: Local
variables:
  - name: baseUrl
    value: http://localhost:8080
    description: ""
  - name: writerApiKey
    value: local-compose-writer-key-change-me
    description: "RBAC: create audit events only"
  - name: auditorApiKey
    value: local-compose-auditor-key-change-me
    description: "RBAC: read-only - query, verify, export, verify export"
