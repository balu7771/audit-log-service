info:
  name: 09. Verify Chain Integrity - Last N Records
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/audit/verify"
  params:
    - name: lastN
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Test Case 9: Verify only the last 2 records in the chain.
  Expected: 200 OK, intact=true, verifiedRecordsCount=2, lastVerifiedSequenceId=3.
